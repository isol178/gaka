name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generated DSL types are up to date
        run: pnpm gen:check
      - name: Biome
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Browser bundle builds (renderer stays DOM/Node-agnostic)
        run: pnpm site:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  python:
    name: Python observer (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: observer/uv.lock
      - run: uv sync --project observer --locked
      - working-directory: observer
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

  evals:
    name: Evals (deterministic + replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run offline evals
        run: pnpm eval:offline --out evals/results/ci
      - name: Job summary
        if: always()
        run: cat evals/results/ci/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evals-offline
          path: evals/results/ci/
          retention-days: 30

  repo:
    name: Repo hygiene (workflows, hooks, ADRs, commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: actionlint and shellcheck
        run: pnpm lint:workflows && pnpm lint:shell
      - name: Claude Code hook tests
        run: pnpm hooks:test
      - name: ADRs
        run: pnpm adr:check
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
