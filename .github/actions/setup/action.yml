name: Setup toolchains
description: Node (pnpm) and Python (uv) with caches, dependencies installed from lockfiles.
inputs:
  python:
    description: Also set up uv and sync the observer package.
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: observer/uv.lock
    - if: inputs.python == 'true'
      run: uv sync --project observer --locked
      shell: bash
