[project]
name = "gaka-observer"
version = "0.0.0"
description = "Observer for the Gaka harness: numeric image feedback, thumbnails and crops."
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "pillow>=11.0"]

[project.scripts]
gaka-observe = "gaka_observer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaka_observer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
